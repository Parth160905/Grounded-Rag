services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pgdocs
      POSTGRES_USER: pgdocs
      POSTGRES_PASSWORD: pgdocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdocs -d pgdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Generation only. Embeddings run in-process in the JVM via ONNX.
  # Pull the model once after first boot:
  #   docker compose exec ollama ollama pull qwen2.5:7b-instruct
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama: